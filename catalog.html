<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle Catalog | CycleSense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-blue-600 text-white p-6 shadow-md text-center">
        <h1 class="text-3xl font-black tracking-tight"><i class="fas fa-bicycle"></i> CycleSense Showroom</h1>
        <p class="text-blue-100 mt-2 font-medium">Premium Bicycles | Visit our shop to purchase!</p>
    </header>

    <main class="container mx-auto p-6 max-w-6xl">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 class="text-2xl font-bold text-gray-700">Available Bicycles</h2>
            <span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-xs font-bold border border-yellow-200">
                <i class="fas fa-store"></i> In-Store Purchases Only
            </span>
        </div>

        <div id="catalog-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-10 text-gray-400 font-bold animate-pulse">
                Loading showroom...
            </div>
        </div>
    </main>

    <script type="module">
        import { getSupabase } from './js/config.js';
        
        async function loadCatalog() {
            const sb = getSupabase();
            const { data, error } = await sb.from('products').select('*').eq('item_type', 'Bicycle');
            
            if (error) {
                document.getElementById('catalog-grid').innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`;
                return;
            }

            const grid = document.getElementById('catalog-grid');
            let html = '';

            data.forEach(bike => {
                let badgeColor = bike.cycle_category === 'New' ? 'bg-green-100 text-green-700 border-green-200' : 
                                 bike.cycle_category === 'Japanese Reconditioned' ? 'bg-blue-100 text-blue-700 border-blue-200' : 
                                 'bg-gray-200 text-gray-700 border-gray-300';

                let stockBadge = bike.stock > 0 
                    ? `<span class="text-green-600 text-xs font-black"><i class="fas fa-check-circle"></i> In Stock (${bike.stock})</span>` 
                    : `<span class="text-red-500 text-xs font-black"><i class="fas fa-times-circle"></i> Out of Stock</span>`;

                html += `
                    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden hover:shadow-xl transition flex flex-col">
                        <div class="h-48 bg-gray-200 relative">
                            <img src="${bike.image_url || 'https://via.placeholder.com/400x300?text=No+Image'}" alt="${bike.name}" class="w-full h-full object-cover">
                            <div class="absolute top-3 left-3 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border ${badgeColor}">
                                ${bike.cycle_category}
                            </div>
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <h3 class="text-xl font-black text-gray-800 mb-1">${bike.name}</h3>
                            <p class="text-xs text-gray-500 font-bold mb-3 border-b pb-3">Code: ${bike.code}</p>
                            <p class="text-sm text-gray-600 mb-4 flex-grow italic">"${bike.specs || 'No details provided.'}"</p>
                            
                            <div class="flex justify-between items-end mt-auto pt-4 border-t border-gray-100">
                                <div>${stockBadge}</div>
                                <div class="text-2xl font-black text-blue-600">Rs. ${bike.unit_price.toLocaleString()}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html || '<p class="col-span-full text-center py-10 text-gray-500">No bicycles available right now.</p>';
        }

        loadCatalog();
    </script>
</body>
</html>
