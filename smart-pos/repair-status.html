<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repair Status Lookup</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="content" style="max-width: 900px; margin: 24px auto;">
    <header class="topbar" style="border-radius: 12px;">
      <div class="page-title">
        <h1>Track Your Bicycle Repair</h1>
        <p>Enter your repair ID to check live status and final bill.</p>
      </div>
    </header>

    <main class="content-body">
      <section class="section">
        <div class="card">
          <label for="public-repair-id">Repair ID</label>
          <input id="public-repair-id" placeholder="REP-123456" />
          <button id="public-check-btn" style="margin-top: 10px;">Check Repair</button>
          <div id="public-result" class="notice" style="margin-top: 16px;">No repair loaded.</div>
          <div id="public-bill" style="margin-top: 16px;"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/repair-status.js"></script>
</body>
</html>
