<div id="pos-view" class="hidden fade-in grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2 space-y-6">
                    <div class="bg-white dark:bg-darkcard p-6 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-bold dark:text-white">New Sale</h2>
                            <div class="flex gap-2">
                                <button onclick="window.showSalesSummary()" class="text-xs bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1.5 rounded-lg transition font-bold"><i class="fas fa-chart-pie"></i> Sales Report</button>
                                <span class="text-xs bg-green-100 text-green-800 px-2 py-1.5 rounded-lg flex items-center">Active</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-3 mb-4">
                            <div class="col-span-2">
                                <label class="text-xs text-gray-500 font-bold uppercase">Product</label>
                                <select id="pos-product-select" class="w-full p-3 border rounded-xl bg-gray-50 dark:bg-slate-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-green-500 outline-none"></select>
                            </div>
                            <div>
                                <label class="text-xs text-gray-500 font-bold uppercase">Qty</label>
                                <div class="flex gap-2">
                                    <input id="pos-qty" type="number" value="1" min="1" class="w-full p-3 border rounded-xl bg-gray-50 dark:bg-slate-700 dark:text-white dark:border-gray-600">
                                    <button onclick="window.addToCart()" class="bg-green-600 text-white px-4 rounded-xl hover:bg-green-700 shadow-md"><i class="fas fa-plus"></i></button>
                                </div>
                            </div>
                        </div>
                        <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                            <thead class="text-xs text-gray-700 uppercase bg-gray-100 dark:bg-slate-800 dark:text-gray-300 rounded-t-lg"><tr><th class="p-3">Item</th><th class="p-3 text-center">Qty</th><th class="p-3 text-right">Price</th><th class="p-3 text-right">Total</th><th class="p-3"></th></tr></thead>
                            <tbody id="cart-table-body"></tbody>
                        </table>
                    </div>
                </div>
                <div class="bg-white dark:bg-darkcard p-6 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 h-fit">
                    <h3 class="font-bold text-lg mb-4 dark:text-white border-b pb-2 dark:border-gray-700">Billing</h3>
                    <form onsubmit="window.processSale(event)" class="space-y-4">
                        <input name="customer_name" placeholder="Customer Name" class="w-full p-3 rounded-xl border bg-gray-50 dark:bg-slate-700 dark:text-white outline-none focus:border-green-500">
                        <input name="phone" placeholder="Phone" class="w-full p-3 rounded-xl border bg-gray-50 dark:bg-slate-700 dark:text-white outline-none focus:border-green-500">
                        <input name="service_cost" id="pos-service-cost" type="number" placeholder="Service Cost (LKR)" oninput="window.renderCart()" class="w-full p-3 rounded-xl border bg-gray-50 dark:bg-slate-700 dark:text-white outline-none focus:border-green-500">
                        <div class="bg-gray-100 dark:bg-slate-800 p-4 rounded-xl mt-4">
                            <div class="flex justify-between text-2xl font-black text-gray-800 dark:text-white"><span>Total</span><span id="pos-total">LKR 0.00</span></div>
                        </div>
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transition transform hover:scale-105">Checkout <i class="fas fa-arrow-right ml-2"></i></button>
                    </form>
                </div>
            </div>
